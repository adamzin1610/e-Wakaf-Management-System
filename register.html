<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Register | e-Waqf</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body data-public="true" data-page="register">
    <div class="auth-wrap">
        <div class="auth-card" style="width:min(650px,100%)">
            <h1>Create account</h1>
            <p class="muted">Only administrators and aid applicants can create accounts.</p>
            <form id="registerForm">
                <div class="form-grid">
                    <div class="field"><label>Account Type</label><select name="role" id="role">
                            <option value="applicant">Aid Applicant</option>
                            <option value="admin">Administrator</option>
                        </select></div>
                    <div class="field"><label>Username</label><input class="input" name="username" required></div>
                    <div class="field"><label>Full Name</label><input class="input" name="fullName" required></div>
                    <div class="field"><label>Email</label><input class="input" type="email" name="email" required>
                    </div>
                    <div class="field"><label>IC Number</label><input class="input" name="icNumber"></div>
                    <div class="field"><label>Contact Number</label><input class="input" name="contactNo"></div>
                    <div class="field"><label>Password</label><input class="input" type="password" name="password"
                            minlength="6" required></div>
                    <div class="field" id="adminCodeWrap" style="display:none"><label>Admin Registration
                            Code</label><input class="input" name="adminCode"></div>
                </div><button class="btn primary" style="width:100%">Create Account</button>
            </form>
        </div>
    </div>
    <script src="/js/app.js"></script>
</body>

</html>
