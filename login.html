<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login | e-Waqf</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body data-public="true" data-page="login">
    <div class="auth-wrap">
        <div class="auth-card">
            <h1>Welcome back</h1>
            <p class="muted">Login as an administrator or aid applicant.</p>
            <form id="loginForm">
                <div class="field"><label>Username or Email</label><input class="input" name="username" required></div>
                <div class="field"><label>Password</label><input class="input" type="password" name="password" required>
                </div><button class="btn primary" style="width:100%">Login</button>
            </form>
            <p class="muted" style="font-size:13px;margin-top:18px">Need an account? <a
                    style="color:var(--blue);font-weight:700" href="/register">Register</a></p>
        </div>
    </div>
    <script src="/js/app.js"></script>
</body>

</html>
