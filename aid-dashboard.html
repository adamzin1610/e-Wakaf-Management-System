<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Applicant Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body data-role="applicant" data-page="aid-dashboard">
    <div class="dashboard-layout">
        <aside class="sidebar"><a class="side-brand" href="/"><span class="brand-mark"
                    aria-label="Surau">☪</span><span><b>e-Waqf</b><small>Applicant Portal</small></span></a>
            <div class="side-user">
                <div class="avatar">U</div>
                <div><b id="sideUserName">Applicant</b><small>Aid Applicant</small></div>
            </div>
            <nav class="side-nav"><a class="active" href="/aid-dashboard.html"><span>🕌</span>Dashboard</a><a class=""
                    href="/my-applications.html"><span>▤</span>My Applications</a><a class=""
                    href="/aid-apply.html"><span>＋</span>New Application</a><a class=""
                    href="/aid-profile.html"><span>◎</span>My Profile</a></nav><a class="side-public"
                href="/"><span>↗</span>View Public Site</a><button class="side-logout" id="logoutBtn">↪&nbsp; Sign
                out</button>
        </aside>
        <main class="dashboard-main">
            <div class="dashboard-head">
                <div>
                    <h1>My Dashboard</h1>
                </div>
            </div>
            <div id="stats" class="stats-grid"></div>
            <div class="panel">
                <div class="panel-head">
                    <h2>My Campaign Progress</h2><span class="muted">Fundraising linked to your approved
                        applications</span>
                </div>
                <div id="campaignProgressGrid" class="campaign-progress-grid"></div>
            </div>
            <div class="panel">
                <div class="panel-head">
                    <h2>Recent Applications</h2><a class="view-site" href="/my-applications.html">View history</a>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Application</th>
                                <th>Amount</th>
                                <th>Status</th>
                                <th>Updated</th>
                            </tr>
                        </thead>
                        <tbody id="recentApplications"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="/js/app.js"></script>
</body>

</html>
