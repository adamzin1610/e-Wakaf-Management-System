<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>New Aid Application</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body data-role="applicant" data-page="aid-apply">
    <div class="dashboard-layout">
        <aside class="sidebar"><a class="side-brand" href="/"><span class="brand-mark"
                    aria-label="Surau">☪</span><span><b>e-Waqf</b><small>Applicant Portal</small></span></a>
            <div class="side-user">
                <div class="avatar">U</div>
                <div><b id="sideUserName">Applicant</b><small>Aid Applicant</small></div>
            </div>
            <nav class="side-nav"><a class="" href="/aid-dashboard.html"><span>🕌</span>Dashboard</a><a class=""
                    href="/my-applications.html"><span>▤</span>My Applications</a><a class="active"
                    href="/aid-apply.html"><span>＋</span>New Application</a><a class=""
                    href="/aid-profile.html"><span>◎</span>My Profile</a></nav><a class="side-public"
                href="/"><span>↗</span>View Public Site</a><button class="side-logout" id="logoutBtn">↪&nbsp; Sign
                out</button>
        </aside>
        <main class="dashboard-main">
            <div class="dashboard-head">
                <div>
                    <h1>Submit Aid Application</h1>
                </div>
            </div>
            <div class="form-card">
                <form id="aidForm" enctype="multipart/form-data">
                    <div class="form-grid">
                        <div class="field"><label>Request Title</label><input class="input" name="title" required></div>
                        <div class="field"><label>Category</label><select name="category" required>
                                <option value="Medical">Medical</option>
                                <option value="Education">Education</option>
                                <option value="Financial">Financial</option>
                                <option value="Equipment">Equipment</option>
                                <option value="Other">Other</option>
                            </select></div>
                        <div class="field"><label>Target Amount (RM)</label><input class="input" type="number" min="0"
                                step="0.01" name="targetAmount" required></div>
                        <div class="field"><label>Supporting Document</label><input class="input" type="file"
                                name="document" accept=".pdf,.jpg,.jpeg,.png"></div>
                        <div class="field full"><label>Description</label><textarea name="description" rows="6"
                                required></textarea></div>
                    </div>
                    <div class="form-actions"><button class="btn primary">Submit Application</button></div>
                </form>
            </div>
        </main>
    </div>
    <script src="/js/app.js"></script>
</body>

</html>
