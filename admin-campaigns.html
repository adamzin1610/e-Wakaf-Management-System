<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Manage Campaigns</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body data-role="admin" data-page="admin-campaigns">
    <div class="dashboard-layout">
        <aside class="sidebar"><a class="side-brand" href="/"><span class="brand-mark"
                    aria-label="Surau">☪</span><span><b>e-Waqf</b><small>Admin Portal</small></span></a>
            <div class="side-user">
                <div class="avatar">A</div>
                <div><b id="sideUserName">Administrator</b><small>Administrator</small></div>
            </div>
            <nav class="side-nav"><a class="" href="/admin-dashboard.html"><span>🕌</span>Dashboard</a><a class="active"
                    href="/admin-campaigns.html"><span>☪</span>Campaigns</a><a class=""
                    href="/admin-applications.html"><span>📋</span>Aid Applications</a><a class=""
                    href="/admin-donations.html"><span>🤲</span>Donations</a><a class=""
                    href="/admin-reports.html"><span>📜</span>Monthly Reports</a></nav><a class="side-public"
                href="/"><span>↗</span>View Public Site</a><button class="side-logout" id="logoutBtn">↪&nbsp; Sign
                out</button>
        </aside>
        <main class="dashboard-main">
            <div class="dashboard-head">
                <div>
                    <h1>Manage Campaigns</h1>
                </div>
            </div>
            <div class="panel admin-create">
                <div class="panel-head">
                    <h2>Create Campaign</h2>
                </div>
                <form id="campaignForm">
                    <div class="form-grid">
                        <div class="field"><label>Title</label><input class="input" name="title" required></div>
                        <div class="field"><label>Target Amount</label><input class="input" type="number" min="1"
                                step="0.01" name="targetAmount" required></div>
                        <div class="field full"><label>Objective</label><textarea name="objective" rows="3"
                                required></textarea></div>
                        <div class="field"><label>Link to Approved Aid Application</label><select class="input"
                                name="applicationId" id="campaignApplication">
                                <option value="">Public campaign (not linked to an applicant)</option>
                            </select></div>
                        <div class="field"><label>Closing Date</label><input class="input" type="date"
                                name="closingDate" required></div>
                        <div class="field"><label>Image URL</label><input class="input" name="imageUrl"
                                placeholder="Optional"></div>
                    </div><button class="btn primary">Create Campaign</button>
                </form>
            </div>
            <div class="panel">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Campaign</th>
                                <th>Target</th>
                                <th>Raised</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="campaignTable"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="/js/app.js"></script>
</body>

</html>
