<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aid Applications</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body data-role="admin" data-page="admin-applications">
  <div class="dashboard-layout">
    <aside class="sidebar"><a class="side-brand" href="/"><span class="brand-mark"
          aria-label="Surau">☪</span><span><b>e-Waqf</b><small>Admin Portal</small></span></a>
      <div class="side-user">
        <div class="avatar">A</div>
        <div><b id="sideUserName">Administrator</b><small>Administrator</small></div>
      </div>
      <nav class="side-nav"><a class="" href="/admin-dashboard.html"><span>🕌</span>Dashboard</a><a class=""
          href="/admin-campaigns.html"><span>☪</span>Campaigns</a><a class="active"
          href="/admin-applications.html"><span>📋</span>Aid Applications</a><a class=""
          href="/admin-donations.html"><span>🤲</span>Donations</a><a class=""
          href="/admin-reports.html"><span>📜</span>Monthly Reports</a></nav><a class="side-public"
        href="/"><span>↗</span>View Public Site</a><button class="side-logout" id="logoutBtn">↪&nbsp; Sign out</button>
    </aside>
    <main class="dashboard-main">
      <div class="dashboard-head">
        <div>
          <h1>Aid Applications</h1>
        </div>
      </div>
      <div class="panel">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Applicant / Request</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Review</th>
              </tr>
            </thead>
            <tbody id="applicationTable"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <div class="application-modal" id="applicationModal" hidden>
    <div class="application-modal-backdrop" id="applicationModalBackdrop"></div>
    <section class="application-modal-card" role="dialog" aria-modal="true" aria-labelledby="applicationModalTitle">
      <div class="application-modal-head">
        <div><span class="eyebrow">APPLICATION INFORMATION</span>
          <h2 id="applicationModalTitle">Aid Application</h2>
        </div>
        <button class="application-modal-close" id="applicationModalClose" type="button"
          aria-label="Close">&times;</button>
      </div>
      <div class="application-detail-grid" id="applicationDetail"></div>
    </section>
  </div>
  <script src="/js/app.js"></script>
</body>

</html>
