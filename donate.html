<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Donate | e-Waqf</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body data-public="true" data-page="donate">
    <main class="section">
        <div class="form-card" style="max-width:720px;margin:auto">
            <h1>Make a Donation</h1>
            <p id="donateCampaign" class="lead"></p>
            <p id="donateTarget" class="muted"></p>
            <form id="donateForm">
                <div class="form-grid">
                    <div class="field"><label>Donor Name</label><input class="input" name="donorName" required></div>
                    <div class="field"><label>Email</label><input class="input" type="email" name="donorEmail" required>
                    </div>
                    <div class="field"><label>Amount (RM)</label><input class="input" type="number" min="1" step="0.01"
                            name="amount" required></div>
                    <div class="field"><label>Payment Method</label><select name="paymentMethod" required>
                            <option value="Online Banking">Online Banking</option>
                            <option value="Card">Card</option>
                            <option value="QR Payment">QR Payment</option>
                        </select></div>
                </div>
                <div class="form-actions"><button class="btn primary">Complete Donation</button></div>
            </form>
        </div>
    </main>
    <script src="/js/app.js"></script>
</body>

</html>
